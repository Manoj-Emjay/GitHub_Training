name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck

      - name: Build application and unit tests
        run: make all

      - name: Run unit tests
        run: make test

      - name: Static analysis (cppcheck)
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem src

      - name: Build container image
        run: docker build -t diagnostic-session-manager:${{ github.sha }} .
