name: Build, Test & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cppcheck

      - name: Compile
        run: make app

      - name: Run unit tests
        run: make test

      - name: Lint (cppcheck)
        run: cppcheck --enable=warning,style --error-exitcode=1 --suppress=missingIncludeSystem src
